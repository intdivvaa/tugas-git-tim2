<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabarKini - Beranda</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0e8;
            color: #292522;
        }

        header {
            background: #292522;
            color: white;
            padding: 25px 8%;
        }

        header span {
            color: #d65f3f;
        }

        nav {
            background: white;
            padding: 15px 8%;
        }

        nav a {
            color: #292522;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #d65f3f;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .utama {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .utama img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            margin: 15px 0;
            border-radius: 5px;
        }

        .kategori {
            color: #d65f3f;
            font-size: 13px;
            font-weight: bold;
        }

        h2 {
            margin: 8px 0;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 9px 15px;
            background: #d65f3f;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        footer {
            background: #292522;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Kabar<span>Kini</span></h1>
        <p>Portal berita terkini dan terpercaya</p>
    </header>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="list-berita.html">List Berita</a>
    </nav>

    <main class="container">

        <article class="utama">
            <span class="kategori">BERITA UTAMA</span>

            <h2>Perkembangan Teknologi di Indonesia</h2>

            <img src="https://images.unsplash.com/photo-1504711434969-e33886168f5c"
                 alt="Berita utama">

            <p>
                Teknologi terus berkembang dan memberikan banyak
                kemudahan dalam kehidupan masyarakat.
            </p>

            <a href="detail-berita.html" class="btn">
                Baca Selengkapnya
            </a>
        </article>

    </main>

    <footer>
        <p>&copy; 2026 KabarKini</p>
    </footer>

</body>
</html>
